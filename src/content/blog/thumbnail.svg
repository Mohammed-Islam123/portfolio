<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <rect width="1200" height="750" fill="#0B0B0B"/>
  <!-- hairline grid -->
  <g stroke="#1A1A1A" stroke-width="1">
    <path d="M0 75H1200M0 150H1200M0 225H1200M0 300H1200M0 375H1200M0 450H1200M0 525H1200M0 600H1200M0 675H1200"/>
    <path d="M75 0V750M150 0V750M225 0V750M300 0V750M375 0V750M450 0V750M525 0V750M600 0V750M675 0V750M750 0V750M825 0V750M900 0V750M975 0V750M1050 0V750M1125 0V750"/>
  </g>
  <!-- calm dot field (echoes the hero DotField) -->
  <g fill="#FFFFFF">
    <circle cx="300" cy="225" r="2.4" opacity="0.55"/>
    <circle cx="450" cy="375" r="3.2" opacity="0.75"/>
    <circle cx="600" cy="225" r="2" opacity="0.35"/>
    <circle cx="750" cy="450" r="2.8" opacity="0.6"/>
    <circle cx="900" cy="300" r="2.2" opacity="0.45"/>
    <circle cx="375" cy="525" r="2" opacity="0.4"/>
    <circle cx="525" cy="150" r="2.6" opacity="0.5"/>
    <circle cx="825" cy="600" r="2.2" opacity="0.42"/>
  </g>
  <!-- the wire — one signal line across the grid -->
  <path d="M0 375 C 200 335, 320 415, 450 375 S 700 320, 825 375 S 1050 420, 1200 375"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>
  <!-- one amber packet on the wire -->
  <circle cx="825" cy="375" r="5" fill="#FFB000"/>
  <circle cx="825" cy="375" r="12" fill="none" stroke="#FFB000" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- corner label -->
  <text x="64" y="700" font-family="monospace" font-size="20" letter-spacing="4" fill="#6E6E6C">/ / writing</text>
</svg>
