<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0B"/>
      <stop offset="100%" stop-color="#1E1E1E"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#232323" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <g font-family="monospace">
    <text x="80" y="120" font-size="14" letter-spacing="3" fill="#FFB000" opacity="0.6">// POST</text>
    <text x="80" y="280" font-size="64" font-weight="700" fill="#FFFFFF" letter-spacing="-2">PostgreSQL</text>
    <text x="80" y="360" font-size="64" font-weight="700" fill="#FFFFFF" letter-spacing="-2">Performance</text>
    <text x="80" y="430" font-size="20" fill="#8A8A88" letter-spacing="1">PostgreSQL · Indexes · Query Tuning · Backend</text>
    <text x="80" y="580" font-size="14" fill="#5A5A58" letter-spacing="3">MOHAMED ISLAM — BACKEND NOTES</text>
  </g>
  <g stroke="#FFB000" stroke-width="2" fill="none" opacity="0.8">
    <ellipse cx="1060" cy="200" rx="60" ry="20"/>
    <ellipse cx="1060" cy="280" rx="60" ry="20"/>
    <ellipse cx="1060" cy="360" rx="60" ry="20"/>
    <line x1="1000" y1="200" x2="1000" y2="360"/>
    <line x1="1120" y1="200" x2="1120" y2="360"/>
  </g>
</svg>
